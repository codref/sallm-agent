[project]
name = "sallm-agent"
version = "0.1.0"
description = "Minimal tool-calling agent over LiteLLM, tuned for local Ollama models"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "litellm",
    "typer",
    "rich",
    "peewee",
    "lancedb",
]

[project.urls]
Homepage = "https://github.com/codref/sallm-agent"
Repository = "https://github.com/codref/sallm-agent"
Issues = "https://github.com/codref/sallm-agent/issues"

[project.scripts]
sallm = "sallm.cli.chat:app"
sallm-echo = "sallm.tools.echo:main"
sallm-calc = "sallm.tools.calc:main"
sallm-dig = "sallm.tools.dig:main"

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "src/sallm",
    "README.md",
    "pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sallm"]

# Map src/sallm -> sallm in the wheel
[tool.hatch.build.targets.wheel.sources]
"src/sallm" = "sallm"
