[project]
name = "sallm-agent"
version = "0.1.0"
description = "Minimal tool-calling agent over LiteLLM, tuned for local Ollama models"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "litellm",
    "typer",
    "rich",
]

[project.scripts]
sallm = "sallm.cli.chat:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sallm"]

# Map src/sallm -> sallm in the wheel
[tool.hatch.build.targets.wheel.sources]
"src/sallm" = "sallm"
