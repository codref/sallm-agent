apiVersion: 1
datasources:
  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    uid: tempo
    jsonData:
      httpMethod: GET
      search:
        hide: false
      nodeGraph:
        enabled: true
      # Grafana 11+ TraceQL search in Explore/dashboards uses gRPC streaming
      # (HTTP /api/ds/query TraceQL search is intentionally stubbed). Requires
      # Tempo stream_over_http_enabled: true.
      streamingEnabled:
        search: true
        metrics: false
      tracesToLogsV2:
        datasourceUid: ""

  - name: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    uid: prometheus
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 5s

  # Tempo HTTP /api/search works; Grafana's built-in TraceQL QueryData path does
  # not. Infinity turns search JSON into dashboard tables with clickable TraceIDs.
  - name: TempoHTTP
    type: yesoreyeram-infinity-datasource
    access: proxy
    uid: tempo-http
    jsonData:
      auth_method: none
